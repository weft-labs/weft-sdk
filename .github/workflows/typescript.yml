name: TypeScript SDK

on:
  pull_request:
    paths:
      - "typescript/**"
      - "spec/**"
      - "scripts/**"
      # Self-test: a change to this workflow must run this workflow, otherwise
      # CI-config regressions land unexercised.
      - ".github/workflows/typescript.yml"
  push:
    branches: ["main"]
    tags: ["v*"]
    # release tags (v* / go/v*) are pushed by bump-version.sh which touches
    # all four language dirs + spec — if that ever changes, revisit these push
    # paths so publishing can't silently die. (Path filters are not evaluated
    # for tag pushes, so the tags above always run; this only trims main
    # pushes that don't touch the SDK.)
    paths:
      - "typescript/**"
      - "spec/**"
      - "scripts/**"

# Default GITHUB_TOKEN is read-only for the whole workflow. The publish job
# overrides this with its own job-level `permissions:` (id-token: write for
# npm Trusted Publishing OIDC, attestations: write for Sigstore provenance).
# Keeping the workflow default minimal closes the default-scope exfiltration
# window on PR-triggered build jobs that run `npm install` against untrusted
# spec/** or scripts/** changes.
permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

# github.workflow MUST stay in the group key. Every language workflow and the
# e2e/sync workflows fire on the same ref; a group keyed on the ref alone puts
# them all in one slot, so with cancel-in-progress the last run created cancels
# the others before a single step executes. That shows up on the PR as a red
# "build"/"publish" check that failed in 0s with no logs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: typescript
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify committed generated SDK
        run: ../scripts/check-generated.sh typescript
      - name: Lint
        run: npm run lint:check
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # id-token: write is required for npm provenance (Sigstore via GitHub
    # OIDC). attestations: write lets the npm CLI record the provenance on
    # the repository's attestations page in addition to the registry.
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: typescript
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify committed generated SDK
        run: ../scripts/check-generated.sh typescript
      - name: Build
        run: npm run build
      # --provenance attaches a Sigstore-signed provenance statement to the
      # publish, tying the artifact to this workflow run + commit. Required
      # by https://docs.npmjs.com/generating-provenance-statements. Node 24
      # ships npm >= 9.5.0 which is the minimum for the flag.
      - name: Publish to npm with provenance
        run: npm publish --access public --provenance
