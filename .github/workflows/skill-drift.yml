# The `weft` Skill under skills/weft/ is vendored byte-identical from
# weftlabs/skills at the commit pinned in skills/SKILLS_REF. This check fails
# whenever the vendored copy drifts from that commit — edit the Skill upstream
# and re-vendor (updating SKILLS_REF) instead of patching the copy here.
name: Skill drift

on:
  pull_request:
    paths:
      - "skills/**"
      - ".github/workflows/skill-drift.yml"
  push:
    branches: ["main"]
    paths:
      - "skills/**"
      - ".github/workflows/skill-drift.yml"

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Diff vendored Skill against pinned weftlabs/skills commit
        run: |
          ref="$(tr -d '[:space:]' < skills/SKILLS_REF)"
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::skills/SKILLS_REF must contain a full commit SHA, got: $ref"
            exit 1
          }
          git init -q canonical
          git -C canonical remote add origin https://github.com/weftlabs/skills.git
          git -C canonical fetch -q --depth 1 origin "$ref"
          git -C canonical checkout -q FETCH_HEAD
          diff -r canonical/skills/weft skills/weft
